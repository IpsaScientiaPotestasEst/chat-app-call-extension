<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MatrixComms // Ultra-Fast Live Audio</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="glow-container">
    <header>
      <h1>MATRIX // COMMS</h1>
      <p class="subtitle">Secure, fast, P2P encrypted terminal</p>
    </header>

    <main class="panel">
      <div class="code-display-section">
        <label>YOUR HANDSHAKE CODE</label>
        <div id="my-code" class="loading-pulse">----</div>
      </div>

      <div class="input-section">
        <label for="target-code">ENTER PEER CODE</label>
        <input type="text" id="target-code" maxlength="4" placeholder="0000" autocomplete="off">
        <button id="connect-btn">CONNECT TO PEER</button>
      </div>

      <div id="status-log" class="status-box">System idle. Ready for pairing handshake.</div>
    </main>

    <audio id="remote-audio" autoplay></audio>
  </div>


  <script src="/socket.io/socket.io.js"></script>
  <script src="client.js"></script>
</body>
</html>
